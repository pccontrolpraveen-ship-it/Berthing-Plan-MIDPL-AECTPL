# Runs the Playwright regression suite on every push and pull request.
name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check www/app.js
          node --check www/sw.js
          node --check www/pwa.js
          node -e "JSON.parse(require('fs').readFileSync('www/manifest.webmanifest','utf8'))"

      - name: Install dependencies
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run regression suite
        run: node tests/test_app.js | tee result.txt

      - name: Fail if the suite reported errors
        run: |
          if grep -q "ERRORS: none" result.txt; then
            echo "All checks passed."
          else
            echo "Regression suite reported errors:"; tail -5 result.txt; exit 1
          fi

      - name: Run progressive web app checks
        run: node tests/test_pwa.js | tee pwa.txt

      - name: Fail if the PWA checks reported errors
        run: |
          if grep -q "ERRORS: none" pwa.txt; then
            echo "Offline launch verified."
          else
            echo "PWA checks reported errors:"; tail -5 pwa.txt; exit 1
          fi

      - name: Run responsive and touch checks
        run: node tests/test_responsive.js | tee responsive.txt

      - name: Fail if the responsive checks reported errors
        run: |
          if grep -q "ERRORS: none" responsive.txt; then
            echo "Phone, tablet and desktop layouts verified."
          else
            echo "Responsive checks reported errors:"; tail -8 responsive.txt; exit 1
          fi

      # Electron needs a display; the runner has no X server of its own.
      - name: Run desktop (Electron) checks
        run: xvfb-run -a node tests/test_desktop.js | tee desktop.txt

      - name: Fail if the desktop checks reported errors
        run: |
          if grep -q "ERRORS: none" desktop.txt; then
            echo "Desktop build verified."
          else
            echo "Desktop checks reported errors:"; tail -8 desktop.txt; exit 1
          fi

      # Packaging is verified separately: the same assertions are re-run against
      # a real build, which is what exercises the asar layout, the unpacked
      # server/ that gets forked, and dependency resolution inside the archive.
      - name: Package the desktop app
        run: npm run desktop:pack -- --linux

      - name: Run desktop checks against the packaged build
        env:
          PORTVISION_PACKAGED: '1'
        run: xvfb-run -a node tests/test_desktop.js | tee desktop-packaged.txt

      - name: Fail if the packaged desktop checks reported errors
        run: |
          if grep -q "ERRORS: none" desktop-packaged.txt; then
            echo "Packaged desktop build verified."
          else
            echo "Packaged desktop checks reported errors:"; tail -8 desktop-packaged.txt; exit 1
          fi
